<div class="flex flex-col mb-16 pr-4 justify-between w-full md:w-1/2">
  <div class="mb-4">
    <a href="{{ .link }}">
      <img src="https://res.cloudinary.com/civicvision/image/upload/f_auto,q_auto,h_400,dpr_auto,c_limit/{{ .cloudinary }}" alt="{{ .title }}">
    </a>
  </div>
  <div class="mb-4">
    <h5>
      <a href="{{ .link }}">
        {{ .title }}
      </a>
    </h5>
    <div class="flex mt-2">
      {{ range .technologies }}
        <div class="text-xs bg-grey-lightest rounded-lg px-2 py-1 mr-4">
          {{ . }}
        </div>
      {{ end }}
    </div>
  </div>
</div>
