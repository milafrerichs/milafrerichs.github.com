{{ $vizmode := "vega-lite" }}
{{ if .Get "mode" }}
  {{ $vizmode := .Get "mode" }}
{{ else }}
  {{ $vizmode := "vega-lite" }}
{{ end }}
{{ $data := .Get "data" }}
{{ $dataJ := index .Site.Data $data | jsonify }}

<script type="text/javascript">
	viz = function() {
    vizSpec = JSON.parse('{{$dataJ | safeJS}}');
    opt = { mode: "{{$vizmode | safeJS}}", actions: false };
    var width, clientWidth;
    {{ if .Get "width" }}
    width = parseInt({{ .Get "width" | safeJS }});
    {{ end }}
    clientWidth = document.getElementById('{{.Get "id" | safeJS}}').clientWidth;
    if(clientWidth < width) {
      width = clientWidth;
    }
    vizSpec['width'] = width;
    vizSpec["autosize"] = {
    "type": "fit",
    "contains": "padding"
    };
    vegaEmbed('#{{.Get "id" | safeJS}}', vizSpec, opt, function(error, result) {
    return;
    });
  }
  if(window.addEventListener){
  window.addEventListener('load', viz);
  }else{
  window.attachEvent('onload', viz);
  }
</script>
