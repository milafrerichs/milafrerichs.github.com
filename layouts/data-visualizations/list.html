{{ define "nav" }}
  {{ partial "nav" . }}
{{ end }}

{{ define "main" }}
  <div class="font-sans text-lg text-grey-darkest spaced-y-6">
    {{ .Content }}
    <div class="mt-16 flex flex-wrap -mx-2">
      {{ range sort (where $.Site.Data.projects ".type" "visualization") "date" "desc" }}
        <div class="w-full md:w-1/2 px-2 mb-16">
          {{ partial "dataviz-item-large" . }}
        </div>
      {{ end }}
    </div>
  </div>
{{ end }}

{{ define "footer" }}
  {{ partial "footer" . }}
{{ end }}
